apiVersion: scheduling.run.ai/v2alpha2
kind: PodGroup
metadata:
  name: dataset-validation
  namespace: cisuc
spec:
  minMember: 1
  queue: cisuc-regular
  priorityClassName: medium

---
apiVersion: batch/v1
kind: Job
metadata:
  name:  dataset-validation
  namespace: cisuc
  labels:
    app: autolr-job
    kai.scheduler/queue: cisuc-regular
    scheduling.run.ai/queue-name: cisuc-regular
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: autolr-job
        kai.scheduler/queue: cisuc-regular
        scheduling.run.ai/queue-name: cisuc-regular
    spec:
      schedulerName: kai-scheduler
      priorityClassName: medium
    initContainers:
      - name: fix-cache-permissions
        image: busybox
        command: ['sh', '-c', 'mkdir -p /home/autolr/models && chown -R 1000:30124 /home/autolr/models && chmod 775 /home/autolr/models']
    containers:
      - name: autolr-test
        image: registry.ml-cluster.dei.uc.pt/library/autolr-image:latest
        command: ["/bin/bash"]
        args:
        - "-c"
        - |
          nvidia-smi

          echo "Contents of cwd before setup:"
          ls -ln
          ls -ln /home/autolr

          echo "Contents of parameters directory:"
          ls -ln parameters/
          ls -ln parameters/dataset_parameters/

          echo "Contents of drive directories:"
          ls -ln /home/autolr/drive/pfcarvalho/dumps
          ls -ln /home/autolr/drive/pfcarvalho/logs
          ls -ln /home/autolr/drive/pfcarvalho/data

          # touch /home/autolr/drive/pfcarvalho/dumps/test.txt
          # touch /home/autolr/drive/pfcarvalho/logs/test.txt
          
          # Set environment variables for data, logs, and dumps directories
          export DATA_DIR=/home/autolr/drive/pfcarvalho/data
          export LOGS_DIR=/home/autolr/drive/pfcarvalho/logs
          export DUMPS_DIR=/home/autolr/drive/pfcarvalho/dumps

          # CUDA_VISIBLE_DEVICES=0 python this_is_just_a_test.py

          CUDA_VISIBLE_DEVICES=0 python -m utils.create_models 

          CUDA_VISIBLE_DEVICES=0 python -m _experiments.dataset_settings

        volumeMounts:
        - name: dumps-volume
          mountPath: /home/autolr/drive
        env:
        - name: JOB_RUN_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CUDA_VISIBLE_DEVICES
          value: "all"
        resources:
          requests:
            # Requesting 1 "slice" (12GB) defined by the profile.
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
      restartPolicy: Never
      securityContext:
        runAsUser: 1000 # 1000 to match nfs website user, 65534 to match "nobody" inside container
        runAsGroup: 30124
        fsGroup: 30124
        supplementalGroups: [30121, 30122, 30123, 30124, 30125, 30126, 30127, 30128]
      volumes:
      - name: dumps-volume
        nfs:
          server: 10.3.10.253
          path: /bai
          readOnly: false
