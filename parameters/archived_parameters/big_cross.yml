RUN: 1
EXPERIMENT_NAME: 'big_cross'
GRAMMAR: 'grammars/deep_architecture_optimizer.txt'
MIN_TREE_DEPTH: 6
MAX_TREE_DEPTH: 40
POPSIZE: 100
GENERATIONS: 100
ELITISM: 1   
TSIZE: 2
PROB_CROSSOVER: 0.9
MODEL: 'resnet'
MULTI_TASK: True
FMNIST_CONFIG: 'parameters/dataset_parameters/FMNIST_CONFIG.json'
CIFAR10_CONFIG: 'parameters/dataset_parameters/CIFAR10_CONFIG.json'
CIFAR100_CONFIG: 'parameters/dataset_parameters/CIFAR100_CONFIG.json' 
TINY_IMAGENET_CUSTOM_CONFIG: 'parameters/dataset_parameters/TINY_IMAGENET_CUSTOM_CONFIG.json'
RACING: True
RACING_ALPHA: 0.05
RACING_MIN_EVALS: 2
RACING_MAX_EVALS: 5
RACING_STAT_TEST: 'mannwhitney'
