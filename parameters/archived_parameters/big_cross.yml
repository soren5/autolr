  6: 0.15, #alpha_layer_var
  7: 0.15, #alpha_const
  8: 0.01, #beta_expr
  9: 0.01, #beta_func
  10: 0.01, #beta_terminal
  11: 0.05, #beta_var_const
  12: 0.15, #beta_arch
  13: 0.15, #beta_layer_var
  14: 0.15, #beta_const
  15: 0.01, #sigma_expr
  16: 0.01, #sigma_func
  17: 0.01, #sigma_terminal
  18: 0.05, #sigma_var_const
  19: 0.15, #sigma_arch
  20: 0.15, #sigma_layer_var
  21: 0.15, #sigma_const
  22: 0.01, #grad_expr
  23: 0.01, #grad_func
  24: 0.01, #grad_terminal
  25: 0.05, #grad_var_const
  26: 0.15, #grad_arch
  27: 0.15, #grad_layer_var
  28: 0.15, #grad_const
}
